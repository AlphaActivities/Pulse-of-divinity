name: V2 navigation candidate QA
on:
  push:
    branches: [dev/v2-crm-navigation]
permissions:
  contents: read
concurrency:
  group: development-engine-qa
  cancel-in-progress: true
jobs:
  qa:
    if: github.ref == 'refs/heads/dev/v2-crm-navigation'
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install isolated browser tools
        run: |
          mkdir -p "$RUNNER_TEMP/engine-results"
          echo "QA_OUT=$RUNNER_TEMP/engine-results" >> "$GITHUB_ENV"
          npm install --prefix "$RUNNER_TEMP/engine-tools" --no-audit --no-fund --no-save playwright@1.56.1
          "$RUNNER_TEMP/engine-tools/node_modules/.bin/playwright" install --with-deps chromium
          echo "QA_PLAYWRIGHT=$RUNNER_TEMP/engine-tools/node_modules/playwright" >> "$GITHUB_ENV"
      - name: Build, validate, and test
        run: node scripts/development-engine-qa.mjs
      - name: Evaluate compatible dependency repairs without deployment
        run: |
          mkdir -p "$RUNNER_TEMP/dependency-candidate"
          cp package.json package-lock.json "$RUNNER_TEMP/dependency-candidate/"
          cd "$RUNNER_TEMP/dependency-candidate"
          npm audit fix --package-lock-only --ignore-scripts --no-fund || true
          npm audit --json > "$QA_OUT/dependency-candidate-audit.json" || true
          cp package-lock.json "$QA_OUT/dependency-candidate-lock.json"
      - name: Test dependency candidate in disposable checkout
        run: |
          set -euo pipefail
          candidate="$RUNNER_TEMP/dependency-compatibility"
          mkdir -p "$candidate"
          git archive HEAD | tar -x -C "$candidate"
          cp "$QA_OUT/dependency-candidate-lock.json" "$candidate/package-lock.json"
          cd "$candidate"
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          printf '%s\n' '{"typecheck":"passed","unitTests":"passed","build":"passed","repositoryLockChanged":false}' > "$QA_OUT/dependency-compatibility.json"
      - name: Upload sanitized QA evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: development-engine-qa-${{ github.run_id }}
          path: ${{ runner.temp }}/engine-results/
          retention-days: 3
          if-no-files-found: ignore
